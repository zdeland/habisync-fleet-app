# First Supabase CLI config in this repo — added for the climate-alerts
# Edge Function (docs/climate-alerts.md). Only [functions.*] is relevant
# here; this repo has no local Supabase stack (db/studio/etc. sections use
# the CLI's own defaults and aren't otherwise used against this project).
project_id = "habisync-fleet"

[functions.climate-alerts]
# The function URL is otherwise public — auth is a hand-checked
# X-Cron-Secret header inside the function body (see index.ts) instead of
# Supabase's own JWT verification, so the cron job doesn't need to embed the
# real service-role JWT in its request headers.
verify_jwt = false

[functions.send-test-alert]
# Opposite of climate-alerts: this one IS called by a real signed-in user
# (the "Send test alert" button), so Supabase's normal JWT verification is
# exactly what's wanted here (true is already the default; declared
# explicitly for contrast with climate-alerts above).
verify_jwt = true
